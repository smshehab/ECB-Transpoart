name: Flutter CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  mobile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Install dependencies
        working-directory: apps/mobile
        run: flutter pub get
      - name: Format check
        working-directory: apps/mobile
        run: dart format --output=none --set-exit-if-changed lib test
      - name: Analyze
        working-directory: apps/mobile
        run: flutter analyze
      - name: Unit tests
        working-directory: apps/mobile
        run: flutter test

  admin-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Install dependencies
        working-directory: apps/admin_web
        run: flutter pub get
      - name: Format check
        working-directory: apps/admin_web
        run: dart format --output=none --set-exit-if-changed lib
      - name: Analyze
        working-directory: apps/admin_web
        run: flutter analyze
      - name: Web build
        working-directory: apps/admin_web
        run: flutter build web
