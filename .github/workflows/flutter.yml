name: Flutter CI

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  mobile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate Flutter platform scaffolding
        working-directory: apps/mobile
        run: bash tool/bootstrap_platforms.sh
      - name: Install dependencies
        working-directory: apps/mobile
        run: flutter pub get
      - name: Format check
        working-directory: apps/mobile
        run: dart format lib test
      - name: Analyze
        working-directory: apps/mobile
        run: flutter analyze
      - name: Unit tests
        working-directory: apps/mobile
        run: flutter test
      - name: Android integration smoke test
        uses: ReactiveCircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: default
          arch: x86_64
          script: cd apps/mobile && flutter test integration_test
      - name: Android debug build
        working-directory: apps/mobile
        run: flutter build apk --debug --dart-define-from-file=../../firebase/firebase_config.example.json

  admin-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate Flutter web scaffolding
        working-directory: apps/admin_web
        run: flutter create --platforms=web .
      - name: Install dependencies
        working-directory: apps/admin_web
        run: flutter pub get
      - name: Format check
        working-directory: apps/admin_web
        run: dart format lib
      - name: Analyze
        working-directory: apps/admin_web
        run: flutter analyze
      - name: Web build
        working-directory: apps/admin_web
        run: flutter build web --dart-define-from-file=../../firebase/firebase_config.example.json
